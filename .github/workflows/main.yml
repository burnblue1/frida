name: Build Rusda Frida 17.6.2
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 自动下载 完整 Frida 17.6.2 官方源码
      - name: 下载完整 Frida 16.2.1
        run: |
          git clone --recurse-submodules https://github.com/frida/frida.git
          cd frida
          git checkout 16.2.1

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-multilib g++-multilib git curl wget unzip python3-pip libc6-dev-i386
          pip3 install meson==1.3.0 lief tomlkit

      - name: 安装 NDK r25c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r25c" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r25c" >> $GITHUB_ENV

      # 自动进入完整源码目录，打补丁
      - name: 应用 Rusda 补丁
        run: |
          cd frida
          for p in ../rusda/16.2.1/frida-core/*; do patch -p1 < "$f" || true;
         
          done

      - name: 配置 & 编译
        run: |
          cd frida
          chmod +x configure
          ./configure --host=android-x86_64
          make -j$(nproc)

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-rusda-17.6.2-x86_64
          path: frida/build/frida-android-x86_64/bin/frida-server
