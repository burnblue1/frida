name: Build Rusda Frida 17.6.2
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 下载官方原版 Frida 17.6.2
      - name: 下载官方源码
        run: |
          git clone --recurse-submodules https://github.com/frida/frida.git
          cd frida
          git checkout 17.6.2

      # 2. 安装依赖
      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-multilib g++-multilib git curl wget unzip python3-pip xz-utils libc6-dev-i386
          pip3 install meson==1.3.0 lief tomlkit

      # 3. 安装 NDK r25c
      - name: 安装 NDK r25c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r25c" >> $GITHUB_ENV

      # 4. 进入源码目录 → 打补丁（官方正确方式）
      - name: 应用 Rusda 官方补丁
        run: |
          cd frida
          for p in ../rusda/17.6.2/patches/deliver/*.patch; do
            echo "Applying $p"
            git apply --ignore-whitespace "$p" || true
          done

      # 5. 运行你提供的官方编译脚本
      - name: 全架构编译
        run: |
          cd frida
          chmod +x ../rusda/17.6.2/tools/build-android-all.sh
          bash ../rusda/17.6.2/tools/build-android-all.sh

      # 6. 上传成品
      - name: 上传所有产物
        uses: actions/upload-artifact@v4
        with:
          name: rusda-frida-17.6.2-all
          path: frida/dist-android/
