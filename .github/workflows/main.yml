name: Build Rusda 17.6.2
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-multilib g++-multilib git curl wget unzip python3-pip xz-utils libc6-dev-i386
          pip3 install meson==1.3.0 lief tomlkit

      - name: 安装 NDK r25c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r25c" >> $GITHUB_ENV

      - name: 拉取官方 17.6.2 完整源码
        run: |
          #git clone https://github.com/frida/frida.git frida
          #cd frida
          #git checkout 17.6.2
          #git submodule update --init --recursive
          git clone --recurse-submodules -b 17.6.2 https://github.com/frida/frida frida17.6.2
          cd frida

      # ==============================
      # 【正确打补丁：分目录】
      # ==============================
      - name: 应用 Rusda 官方补丁
        run: |
          cd frida
          # 1. 根目录补丁
          git apply ../rusda/17.6.2/patches/deliver/superrepo.patch

          # 2. frida-core 补丁
          cd subprojects/frida-core
          git apply ../../../rusda/17.6.2/patches/deliver/frida-core.patch
          cd ../..

          # 3. frida-gum 补丁
          cd subprojects/frida-gum
          git apply ../../../rusda/17.6.2/patches/deliver/frida-gum.patch
          cd ../..

      - name: 编译
        run: |
          cd frida
          bash ./tools/build-android-all.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: rusda-frida-17.6.2
          path: frida/dist-android/
