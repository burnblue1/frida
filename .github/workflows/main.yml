name: Build Rusda Frida 17.6.2
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 必须要，否则补丁无法应用

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential git curl wget unzip python3-pip libc6-dev-i386
          pip3 install meson lief

      - name: 安装 NDK r25c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r25c" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r25c" >> $GITHUB_ENV

      - name: 应用 Rusda 官方补丁（正确路径）
        run: |
          git ls-files
          for p in rusda/17.6.2/patches/deliver/*.patch; do
            echo "Applying $p..."
            git apply --ignore-whitespace "$p" || true
          done

      - name: 给编译脚本加权限
        run: chmod +x configure

      - name: 官方配置
        run: ./configure --host=android-x86_64

      - name: 官方编译
        run: make -j$(nproc)

      - name: 上传最终成品
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-rusda-17.6.2-x86_64
          path: build/frida-android-x86_64/bin/frida-server
