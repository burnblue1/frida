name: Build Rusda 16.2.1
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-multilib g++-multilib git curl wget unzip python3-pip xz-utils libc6-dev-i386
          pip3 install meson==1.3.0 lief tomlkit

      - name: 安装 NDK r25c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r25c" >> $GITHUB_ENV

      - name: 拉取官方 17.6.2 完整源码
        run: |
          #git clone https://github.com/frida/frida.git frida
          #cd frida
          #git checkout 16.2.1
          #git submodule update --init --recursive
          git clone --recurse-submodules -b 17.6.2 https://github.com/frida/frida frida16.2.1
          cd frida16.2.1

      # ==============================
      # 【正确打补丁：分目录】
      # ==============================
      - name: 应用 Rusda 官方补丁
        run: |
          cd frida16.2.1
         
           
          # 2. frida-core 补丁
          cd subprojects/frida-core
          for f in ../rusda/16.2.1/frida-core/*; do patch -p1 < "$f" || true; done 
          cd ../..

          # 3. frida-gum 补丁
          cd subprojects/frida-gum
          for f in ../rusda/16.2.1/frida-gum/*; do patch -p1 < "$f" || true; done 
          cd ../..

      - name: 编译
        run: |
          cd frida16.2.1
          bash ./tools/build-android-all.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: rusda-frida-16.2.1
          path: frida16.2.1/dist-android/
